services:
  frontend:
    build: ./frontend
    container_name: nextjs_app
    restart: always

  backend:
    build: ./backend
    container_name: fastapi_app
    restart: always
    ports:
      - "8000:8000"

  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend
