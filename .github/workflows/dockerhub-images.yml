name: Build & Push Docker images
on:
  push:
    branches:
      - master
    paths:
      - 'mega-projects/todo-app/frontend/**'
      - 'mega-projects/todo-app/backend/**'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: mega-projects/todo-app/backend
            image: venisasarah/todo-backend
            version: v1.0.2
          - context: mega-projects/todo-app/frontend
            image: venisasarah/todo-frontend
            version: v1.0.3
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ matrix.version }}
