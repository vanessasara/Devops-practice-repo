apiVersion: apps/v1
kind: Deployment
metadata:
  name: sony-interior
  namespace: sony-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sony-interior
  template:
    metadata:
      labels:
        app: sony-interior
    spec:
      containers:
        - name: sony-interior
          image: venisasarah/sony-interior:frontendv1.0.3
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: sony-interior
  namespace: sony-dev
spec:
  selector:
    app: sony-interior
  ports:
    - port: 3000
      targetPort: 3000
