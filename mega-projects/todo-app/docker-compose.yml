services:
  frontend:
    build: ./frontend
    container_name: nextjs_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build: ./backend
    container_name: fastapi_app
    restart: always
    ports:
      - "8000:8000"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge