apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-demo-dev
  namespace: nginx-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-demo-dev
  template:
    metadata:
      labels:
        app: nginx-demo-dev
    spec:
      containers:
        - name: nginx-demo-dev
          image: ghcr.io/nginxinc/nginx-unprivileged:latest
          ports:
            - containerPort: 80
