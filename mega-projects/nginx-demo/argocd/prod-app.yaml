apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sony-interior-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/vanessasara/Devops-practice-repo.git
    targetRevision: master
    path: mega-projects/sony-interior-app/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: sony-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
