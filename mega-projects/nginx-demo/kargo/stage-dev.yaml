apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: my-app
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: nginx-demo-warehouse
      sources:
        direct: true
  promotionTemplate:
    spec:
      steps:
        - uses: git-clone
          config:
            repoURL: https://github.com/vanessasara/Devops-practice-repo.git
            checkout:
              - branch: master
                path: ./repo
        - uses: yaml-update
          config:
            path: ./repo/mega-projects/nginx-demo/dev/deployment.yaml
            updates:
              - key: spec.template.spec.containers.0.image
                value: ${{ imageFrom("docker.io/nginxdemos/hello") }}
        - uses: git-commit
          config:
            path: ./repo
            message: "chore: promote dev to ${{ imageFrom('docker.io/nginxdemos/hello') }}"
        - uses: git-push
          config:
            path: ./repo
        - uses: argocd-update
          config:
            apps:
              - name: nginx-dev
                namespace: argocd
