apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo
  namespace: argocd
spec:
  project: default
  destination:
    namespace: kargo
    server: https://kubernetes.default.svc
  sources:
    - repoURL: ghcr.io/akuity/kargo-charts
      chart: kargo
      targetRevision: 1.3.1   # check latest: helm search repo kargo
      helm:
        valueFiles:
          - $values/mega-projects/todo-promotion/kargo/values.yaml

    - repoURL: https://github.com/vanessasara/Devops-practice-repo.git
      targetRevision: master
      ref: values
      path: mega-projects/todo-promotion/kargo/additional-manifests

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
