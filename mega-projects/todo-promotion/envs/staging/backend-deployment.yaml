apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend
  namespace: todo-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-backend
  template:
    metadata:
      labels:
        app: todo-backend
    spec:
      containers:
        - name: todo-backend
          image: venisasarah/todo-backend:v1.0.2
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: todo-backend
  namespace: todo-staging
spec:
  selector:
    app: todo-backend
  ports:
    - port: 8000
      targetPort: 8000
